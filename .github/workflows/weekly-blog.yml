name: Weekly Blog Publish

# Publishes the next queued blog post every Tuesday morning.
# Cron is in UTC. 16:00 UTC is about 9:00 AM in Las Vegas during PDT
# (8:00 AM during PST in winter). You can also run it manually from the
# Actions tab using "Run workflow".
on:
  schedule:
    - cron: '0 16 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Publish next queued post
        run: python scripts/publish_next_post.py

      - name: Commit and push if a post was published
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-publish weekly blog post"
            git push
            echo "Published a new post."
          else
            echo "Queue empty or nothing changed. Nothing published."
          fi
